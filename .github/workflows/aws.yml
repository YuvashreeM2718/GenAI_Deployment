# Build a container image, push it to Amazon ECR, and deploy a new task
# definition revision to Amazon ECS on every push to the "cloud_rag_apis" branch.
#
# Target task definition: frugal-server-auwexo
#   runtimePlatform: LINUX / X86_64  -> ubuntu-latest builds this natively
#   container name:   Main-container
#
# Required GitHub Actions secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
# Required IAM permissions for that user:
#   ecr:GetAuthorizationToken, ecr:BatchCheckLayerAvailability, ecr:PutImage,
#   ecr:InitiateLayerUpload, ecr:UploadLayerPart, ecr:CompleteLayerUpload,
#   ecs:DescribeTaskDefinition, ecs:RegisterTaskDefinition,
#   ecs:UpdateService, ecs:DescribeServices,
#   iam:PassRole (on arn:aws:iam::797671033939:role/ecsTaskExecutionRole)

name: Deploy to Amazon ECS

on:
  push:
    branches: [ "cloud_rag_apis" ]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: fastapi-apis-registry
  ECS_CLUSTER: brave-cat-xzjk5z
  ECS_SERVICE: frugal-server-auwexo-service-dcu1h1om
  ECS_TASK_FAMILY: frugal-server-auwexo       # family registered in ECS
  ECS_TASK_DEFINITION: task-definition.json   # local file the render step reads
  CONTAINER_NAME: Main-container              # matches containerDefinitions[].name
  BUILD_PLATFORM: linux/amd64                 # matches runtimePlatform X86_64

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        set -euo pipefail
        IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

        docker build --platform "$BUILD_PLATFORM" -t "$IMAGE" .

        # Fail here rather than 15 minutes later on service stability if the
        # image architecture doesn't match the task definition's runtimePlatform.
        BUILT_ARCH=$(docker image inspect "$IMAGE" --format '{{.Architecture}}')
        echo "Built image architecture: $BUILT_ARCH (expected amd64)"
        if [ "$BUILT_ARCH" != "amd64" ]; then
          echo "::error::Image is $BUILT_ARCH but the task definition requires X86_64 (amd64)."
          exit 1
        fi

        docker push "$IMAGE"
        echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

    - name: Download task definition
      run: |
        set -euo pipefail
        aws ecs describe-task-definition \
          --task-definition "$ECS_TASK_FAMILY" \
          --query taskDefinition \
        | jq '{family, taskRoleArn, executionRoleArn, networkMode,
               containerDefinitions, volumes, placementConstraints,
               requiresCompatibilities, cpu, memory, pidMode, ipcMode,
               proxyConfiguration, ephemeralStorage, runtimePlatform}
              | with_entries(select(.value != null))' \
        > "$ECS_TASK_DEFINITION"

        echo "Registering against runtimePlatform:"
        jq -c '.runtimePlatform' "$ECS_TASK_DEFINITION"

    - name: Fill in the new image ID in the Amazon ECS task definition
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: ${{ env.ECS_TASK_DEFINITION }}
        container-name: ${{ env.CONTAINER_NAME }}
        image: ${{ steps.build-image.outputs.image }}

    - name: Deploy Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true
        wait-for-minutes: 15