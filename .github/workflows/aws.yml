# Build a linux/arm64 container image, push it to Amazon ECR, and deploy a new
# task definition to Amazon ECS on every push to the "cloud_rag_apis" branch.
#
# The ECS service runs on Fargate with runtimePlatform.cpuArchitecture = ARM64,
# so the image MUST be built for linux/arm64. GitHub's ubuntu-latest runners are
# x86_64, so we cross-build with Buildx + QEMU emulation.
#
# Required GitHub Actions secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
# Required IAM permissions: ecr:*, ecs:DescribeTaskDefinition,
#   ecs:RegisterTaskDefinition, ecs:UpdateService, ecs:DescribeServices,
#   iam:PassRole (for the task execution role)

name: Deploy to Amazon ECS

on:
  push:
    branches: [ "cloud_rag_apis" ]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: fastapi-apis-registry
  ECS_SERVICE: rag-apis-task-service-9ylz6s2a
  ECS_CLUSTER: rare-elephant-g2j754
  ECS_TASK_FAMILY: rag-apis-task            # family name registered in ECS
  ECS_TASK_DEFINITION: task-definition.json # local file the render step reads
  CONTAINER_NAME: rag-api-container         # must match containerDefinitions[].name
  BUILD_PLATFORM: linux/arm64               # must match runtimePlatform in the task def

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # Registers QEMU binfmt handlers so the x86_64 runner can execute arm64
    # instructions during `pip install`. This is what makes the cross-build work.
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: ${{ env.BUILD_PLATFORM }}
        push: true
        provenance: false          # keep a plain image manifest; ECS dislikes attestation indexes
        tags: |
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Export image reference
      id: image
      run: |
        echo "uri=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

    - name: Download task definition
      run: |
        aws ecs describe-task-definition \
          --task-definition "$ECS_TASK_FAMILY" \
          --query taskDefinition \
        | jq '{family, taskRoleArn, executionRoleArn, networkMode,
               containerDefinitions, volumes, placementConstraints,
               requiresCompatibilities, cpu, memory, tags, pidMode, ipcMode,
               proxyConfiguration, inferenceAccelerators, ephemeralStorage,
               runtimePlatform}
              | with_entries(select(.value != null))' \
        > "$ECS_TASK_DEFINITION"

        echo "Task definition runtimePlatform:"
        jq -c '.runtimePlatform' "$ECS_TASK_DEFINITION"

    # Fail fast with a clear message if the image arch and the task definition
    # disagree, instead of waiting 10 minutes for service stability to time out.
    - name: Assert image architecture matches task definition
      run: |
        TD_ARCH=$(jq -r '.runtimePlatform.cpuArchitecture // "X86_64"' "$ECS_TASK_DEFINITION")
        IMG_ARCH=$(docker buildx imagetools inspect "${{ steps.image.outputs.uri }}" --raw \
                   | jq -r '(.manifests[0].platform.architecture) // "unknown"')

        # ECS uses X86_64/ARM64; OCI manifests use amd64/arm64.
        case "$TD_ARCH" in
          ARM64)  WANT=arm64 ;;
          X86_64) WANT=amd64 ;;
          *)      WANT=unknown ;;
        esac

        echo "Task definition wants: $TD_ARCH ($WANT)"
        echo "Image manifest arch:   $IMG_ARCH"

        if [ "$IMG_ARCH" != "$WANT" ] && [ "$IMG_ARCH" != "unknown" ]; then
          echo "::error::Architecture mismatch. The task definition requires $TD_ARCH but the image is $IMG_ARCH. Set BUILD_PLATFORM to linux/$WANT."
          exit 1
        fi

    - name: Fill in the new image ID in the Amazon ECS task definition
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v2
      with:
        task-definition: ${{ env.ECS_TASK_DEFINITION }}
        container-name: ${{ env.CONTAINER_NAME }}
        image: ${{ steps.image.outputs.uri }}

    - name: Deploy Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true
        wait-for-minutes: 15