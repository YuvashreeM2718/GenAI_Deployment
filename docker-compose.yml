version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: interior-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: interior-qdrant
    ports:
      - "6333:6333"   # REST/gRPC UI
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: interior-postgres
    environment:
      POSTGRES_USER: interior_user
      POSTGRES_PASSWORD: interior_pass
      POSTGRES_DB: interior_quotes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interior_user -d interior_quotes"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  quotation-mcp:
    build:
      context: ./quotation-mcp-server
    container_name: interior-quotation-mcp
    environment:
      DATABASE_URL: postgresql+psycopg://interior_user:interior_pass@postgres:5432/interior_quotes
      MCP_HOST: 0.0.0.0
      MCP_PORT: 9000
      PUBLIC_BASE_URL: http://localhost:9000
      PDF_OUTPUT_DIR: /app/generated_pdfs
    ports:
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./quotation-mcp-server:/app
      - pdf_data:/app/generated_pdfs
    # healthcheck:
    #   test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
    #   interval: 5s
    #   timeout: 5s
    #   retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: interior-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_started
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
      quotation-mcp:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    container_name: interior-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data:
  qdrant_data:
  postgres_data:
  pdf_data:
